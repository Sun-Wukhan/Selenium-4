name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Maven suite (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run the suite headless
        run: mvn -B -pl client -am test -Dheadless=true -Dbrowser=chrome

      - name: Upload Extent report and Surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            client/target/extent-report/**
            client/target/surefire-reports/**
          if-no-files-found: ignore

  docker:
    name: Docker suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the test image
        run: make docker-build

      - name: Run the suite in Docker
        run: make docker-test

      - name: Upload Extent report from the Docker run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-reports
          path: client/target/extent-report/**
          if-no-files-found: ignore
