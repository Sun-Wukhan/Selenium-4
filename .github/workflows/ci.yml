name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Maven suite (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox, edge ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run suite headless
        run: mvn -B -pl client -am test -Dheadless=true -Dbrowser=${{ matrix.browser }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.browser }}
          path: |
            client/target/extent-report
            client/target/surefire-reports
          if-no-files-found: warn

  docker:
    name: Docker suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: make docker-build

      - name: Run suite in Docker
        run: make docker-test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-report
          path: client/target/extent-report
          if-no-files-found: warn

  report:
    name: Publish Extent report to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Chrome run's report
        uses: actions/download-artifact@v4
        with:
          name: test-reports-chrome
          path: report-site
      - name: Promote report to site root
        run: cp -r report-site/extent-report/. report-site/

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: report-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  triage:
    name: AI failure triage
    if: failure()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-*
          path: reports

      - name: Run AI triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_TRIAGE_MODEL: ${{ vars.AI_TRIAGE_MODEL }}
        run: python3 ci/ai-triage.py reports ai-triage.md

      - name: Publish triage to run summary
        if: always()
        run: cat ai-triage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload triage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-triage
          path: ai-triage.md
          if-no-files-found: warn
